name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 踏み跡の形式検査
        run: python3 scripts/validate_knowledge.py knowledge
      - name: miso ファイルの検査（警告つき）
        run: python3 scripts/check_miso.py miso/terrio.md
